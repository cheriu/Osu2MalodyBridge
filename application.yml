server:
  port: 8081
  # bind_address: "::"  # dual-stack IPv4+IPv6 (default). Use "0.0.0.0" for IPv4 only.
  # tls_cert: "/path/to/cert.pem"  # enable HTTPS (both cert + key required)
  # tls_key: "/path/to/key.pem"
malody:
  server:
    api: 202310
    min: 202310
    # 欢迎词
    welcome: Welcome to this osu! to MalodyV server
    # 缓存路径，推荐设置绝对路径
    tmp: "/tmp/Osu2Malody"
    # When true, reject requests missing valid uid/key/api query params (per Malody spec).
    # When false (default), accept all requests.
    # verify_client_auth: true
  osu:
    # Set via YAML or override with OSU_CLIENT_ID / OSU_CLIENT_SECRET env vars
    clientID: 
    clientSecret: 

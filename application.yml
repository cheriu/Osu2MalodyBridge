server:
  port: 8081
  host: localhost  # required: public IP or domain for download URLs,examples: `malody.example.com`, `192.168.1.100`,`::1`
  # tls_cert: "/path/to/cert.pem"  # enable HTTPS (both cert + key required)
  # tls_key: "/path/to/key.pem"
malody:
  server:
    api: 202310
    min: 202310
    welcome: Welcome to this osu! to MalodyV server
    tmp: "./Osu2Malody"
    max_osz_size: 10G          # max total .osz cache size in tmp (default: 10G).
    verify_client_auth: false
    mirror: hinamizawa  # download mirror: hinamizawa (default), catboy, osudirect
  osu:
    # Set via YAML or override with OSU_CLIENT_ID / OSU_CLIENT_SECRET env vars
    clientID: 
    clientSecret: 

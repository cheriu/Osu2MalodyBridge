[package]
name = "osu2malody-store"
version = "0.2.2"
edition = "2021"

[dependencies]
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
rosu-v2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
zip = "2"
moka = { version = "0.12", features = ["sync"] }
md-5 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"

[dev-dependencies]
tower = "0.5"
serde_urlencoded = "0.7"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
